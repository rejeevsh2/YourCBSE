name: Refresh PowerPoint Dependency Locks

on:
  push:
    branches: [feature/inline-powerpoint-slide-viewer]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh both dependency lockfiles
        run: |
          bun install --lockfile-only
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock PowerPoint viewer dependency"
            git push origin HEAD:feature/inline-powerpoint-slide-viewer
          fi
