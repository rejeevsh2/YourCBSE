name: Android test APK

on:
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "mobile/**"
      - "package*.json"
      - "*config*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check the website still builds
        run: npm run build
      - name: Package the Android web assets
        run: npm run android:sync
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build the test APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YourSchool-Android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
