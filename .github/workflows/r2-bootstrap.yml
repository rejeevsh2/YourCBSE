name: Refresh YourSchool R2 Composer lockfile

on:
  push:
    branches: [feature/r2-presentation-setup]
    paths:
      - backend/composer.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, fileinfo, curl, zip, intl
          coverage: none
          tools: composer:v2

      - name: Update only required Composer packages and security fixes
        run: composer update league/flysystem-aws-s3-v3 laravel/framework league/commonmark league/flysystem symfony/http-foundation --with-all-dependencies --minimal-changes --no-interaction --no-progress

      - name: Audit locked dependencies
        run: composer audit --no-interaction

      - name: Prepare tests
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Run Laravel tests
        run: php artisan test

      - name: Commit verified Composer lockfile
        working-directory: .
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/composer.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "chore: lock R2 adapter and patched Laravel dependencies"
            git push origin HEAD:feature/r2-presentation-setup
          fi
