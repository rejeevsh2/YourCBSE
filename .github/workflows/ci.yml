name: YourSchool CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Laravel tests (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, fileinfo, curl, zip, intl
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Run Laravel tests (in-memory SQLite)
        run: php artisan test

  frontend:
    name: TypeScript and production build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Match lockfile npm version
        run: |
          npm install --global npm@11.10.0
          node --version
          npm --version

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check registration error handling
        run: npm run test:auth

      - name: Check native links, gestures and video playback
        run: npm run test:native

      - name: Build frontend
        run: npm run build

  converter:
    name: PowerPoint converter tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/presentation-converter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install converter test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Check converter syntax
        run: python -m compileall -q .

      - name: Run converter authentication tests
        run: python -m unittest discover -s tests -v
